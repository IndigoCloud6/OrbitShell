[package]
name = "orbitshell"
version = "0.1.0"
description = "OrbitShell desktop SSH workspace"
edition = "2021"
rust-version = "1.90"
default-run = "OrbitShell"

[[bin]]
name = "OrbitShell"
path = "src/main.rs"

[[bin]]
name = "Xshell"
path = "src/bin/xshell.rs"

[lib]
name = "orbitshell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
russh = "=0.65.1"
russh-sftp = "=3.0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "fs", "time", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
tempfile = "3"
rfd = "0.15"
rmcp = { version = "=3.9.0", features = ["server", "macros", "transport-streamable-http-server"] }
axum = "0.8"
subtle = "2"
url = "2"
percent-encoding = "2"
base64 = "0.22"
sha2 = "=0.10.9"
tauri-plugin-deep-link = "=2.6.3"
tauri-plugin-single-instance = "=2.5.5"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_Memory", "Win32_System_DataExchange", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_UI_Shell_Common", "Win32_UI_Input_KeyboardAndMouse"] }
windows-core = "=0.62.2"
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole"] }
