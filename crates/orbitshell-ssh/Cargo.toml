[package]
name = "orbitshell-ssh"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.90"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
percent-encoding = "2"
russh = "=0.65.1"
russh-sftp = "=3.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_Memory", "Win32_System_DataExchange", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_UI_Shell_Common", "Win32_UI_Input_KeyboardAndMouse"] }
windows-core = "=0.62.2"
